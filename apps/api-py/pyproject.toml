[project]
name = "commerce-ai-api"
version = "0.0.1"
description = "Backend FastAPI de Commerce AI SaaS"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "pgvector>=0.3.6",
  "alembic>=1.14",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "pyjwt>=2.10",
  "bcrypt>=4.2",
  "httpx>=0.28",
  "boto3>=1.35",
  "aiosmtplib>=3.0",
  "pypdf>=5.1",
  "python-multipart>=0.0.18",
  "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "boto3-stubs[s3]>=1.35",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: `ruff format` ya ajusta el código; los textos largos (prompts, mensajes) no se parten.
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
